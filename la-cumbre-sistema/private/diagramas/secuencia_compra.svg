<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;font-size:11px;fill:#1f2937}.b{fill:#fff;stroke:#1f2937;stroke-width:1.2}.h{fill:#e9dfc4;stroke:#1f2937;stroke-width:1.2}.l{stroke:#1f2937;stroke-width:1.2;fill:none}.d{stroke-dasharray:6 4}.t{font-weight:700;text-anchor:middle}.a{font-style:italic}.i{font-style:italic;fill:#555}.m{font-size:10px}.p{fill:#f6e7bd;stroke:#8a5a14;stroke-width:1.5}.ac{fill:#e9dfc4;stroke:#1f2937}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2937"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10" fill="none" stroke="#1f2937" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L12,6L0,12z" fill="#fff" stroke="#1f2937"/></marker></defs><text class="a" style="font-size:14px;font-weight:700" x="20" y="22" text-anchor="start">Diagrama de secuencia: compra desde el carrito</text><rect class="h" x="10" y="40" width="160" height="30"/><text class="t" x="90" y="60" text-anchor="middle">Cliente</text><line class="l d" x1="90" y1="70" x2="90" y2="620"/><rect class="h" x="200" y="40" width="160" height="30"/><text class="t" x="280" y="60" text-anchor="middle">Vista (checkout.ejs)</text><line class="l d" x1="280" y1="70" x2="280" y2="620"/><rect class="h" x="410" y="40" width="160" height="30"/><text class="t" x="490" y="60" text-anchor="middle">Controlador (tienda)</text><line class="l d" x1="490" y1="70" x2="490" y2="620"/><rect class="h" x="620" y="40" width="160" height="30"/><text class="t" x="700" y="60" text-anchor="middle">Modelo (Carrito/Pedido)</text><line class="l d" x1="700" y1="70" x2="700" y2="620"/><rect class="h" x="830" y="40" width="160" height="30"/><text class="t" x="910" y="60" text-anchor="middle">PostgreSQL</text><line class="l d" x1="910" y1="70" x2="910" y2="620"/><rect class="l" x="200" y="318" width="800" height="150"/><rect class="h" x="200" y="318" width="40" height="16"/><text class="m" x="220" y="330" text-anchor="middle">alt</text><text class="m" x="250" y="330" text-anchor="start">[stock suficiente y mínimo de piezas cumplido]</text><line class="l" x1="90" y1="95" x2="280" y2="95" marker-end="url(#ar)"/><text class="m" x="185.0" y="90" text-anchor="middle">1: pulsa "Ir a pagar"</text><line class="l" x1="280" y1="125" x2="490" y2="125" marker-end="url(#ar)"/><text class="m" x="385.0" y="120" text-anchor="middle">2: GET /pago</text><line class="l" x1="490" y1="155" x2="700" y2="155" marker-end="url(#ar)"/><text class="m" x="595.0" y="150" text-anchor="middle">3: Carrito.listar(idUsuario)</text><line class="l" x1="700" y1="185" x2="910" y2="185" marker-end="url(#ar)"/><text class="m" x="805.0" y="180" text-anchor="middle">4: SELECT carrito JOIN productos</text><line class="l d" x1="910" y1="215" x2="700" y2="215" marker-end="url(#ao)"/><text class="m" x="805.0" y="210" text-anchor="middle">5: items</text><line class="l d" x1="490" y1="245" x2="280" y2="245" marker-end="url(#ao)"/><text class="m" x="385.0" y="240" text-anchor="middle">6: render(items, total)</text><line class="l" x1="90" y1="290" x2="490" y2="290" marker-end="url(#ar)"/><text class="m" x="290.0" y="285" text-anchor="middle">7: POST /pago (método, dirección)</text><line class="l" x1="490" y1="350" x2="700" y2="350" marker-end="url(#ar)"/><text class="m" x="595.0" y="345" text-anchor="middle">8: Pedido.crear(items)</text><line class="l" x1="700" y1="380" x2="910" y2="380" marker-end="url(#ar)"/><text class="m" x="805.0" y="375" text-anchor="middle">9: BEGIN, INSERT pedido/detalle, UPDATE stock, COMMIT</text><line class="l d" x1="700" y1="410" x2="490" y2="410" marker-end="url(#ao)"/><text class="m" x="595.0" y="405" text-anchor="middle">10: idPedido</text><line class="l" x1="490" y1="440" x2="700" y2="440" marker-end="url(#ar)"/><text class="m" x="595.0" y="435" text-anchor="middle">11: Carrito.vaciar()</text><line class="l d" x1="490" y1="500" x2="90" y2="500" marker-end="url(#ao)"/><text class="m" x="290.0" y="495" text-anchor="middle">12: redirect /mis-pedidos (pedido registrado)</text><line class="l d" x1="490" y1="560" x2="90" y2="560" marker-end="url(#ao)"/><text class="m" x="290.0" y="555" text-anchor="middle">[sin stock] redirect /carrito con mensaje de error</text></svg>